org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Backend URL baked into the app at build time.
#   10.0.2.2      -> your dev machine, as seen from the Android emulator
#   192.168.x.x   -> your dev machine, as seen from a physical phone on Wi-Fi
#   https://...   -> your deployed backend
# Change this, then rebuild. It is also read at runtime from BuildConfig.
# ---------------------------------------------------------------------------
MEDIA_API_BASE_URL=http://10.0.2.2:8000/
